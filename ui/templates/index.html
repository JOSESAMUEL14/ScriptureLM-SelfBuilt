<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScriptureLM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0f;
            color: #f5f5f5;
            min-height: 100vh;
        }

        /* ==============================
           HEADER
        ============================== */

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            border-bottom: 1px solid #24242c;
            background: #0b0b0f;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 21px;
            font-weight: 700;
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #17171f;
            border: 1px solid #30303a;

            font-size: 20px;
        }

        .logo span {
            color: #ffffff;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #9999a5;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #ffffff;
        }


        /* ==============================
           HERO
        ============================== */

        .hero {
            max-width: 900px;
            margin: 0 auto;

            padding: 90px 20px 50px;

            text-align: center;
        }

        .hero-badge {
            display: inline-block;

            padding: 7px 14px;

            border-radius: 20px;

            border: 1px solid #30303a;

            background: #131319;

            color: #aaaab5;

            font-size: 12px;

            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: clamp(40px, 7vw, 68px);

            line-height: 1.05;

            margin-bottom: 20px;

            letter-spacing: -2px;
        }

        .hero h1 span {
            color: #b7b7c5;
        }

        .hero p {
            max-width: 650px;

            margin: 0 auto;

            color: #858591;

            font-size: 17px;

            line-height: 1.7;
        }


        /* ==============================
           QUESTION BOX
        ============================== */

        .question-section {
            max-width: 850px;

            margin: 0 auto;

            padding: 0 20px 70px;
        }

        .question-box {
            background: #111117;

            border: 1px solid #292932;

            border-radius: 18px;

            padding: 20px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        textarea {
            width: 100%;

            min-height: 100px;

            resize: vertical;

            background: transparent;

            border: none;

            outline: none;

            color: #ffffff;

            font-size: 16px;

            line-height: 1.6;

            font-family: inherit;
        }

        textarea::placeholder {
            color: #666672;
        }

        .question-footer {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 15px;
        }

        .hint {
            color: #5f5f6a;

            font-size: 12px;
        }

        .ask-button {
            border: none;

            padding: 12px 22px;

            border-radius: 10px;

            background: #ffffff;

            color: #0b0b0f;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .ask-button:hover {
            transform: translateY(-1px);

            background: #dddddd;
        }

        .ask-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }


        /* ==============================
           EXAMPLES
        ============================== */

        .examples {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;

            margin-top: 18px;
        }

        .example {
            padding: 8px 13px;

            border-radius: 20px;

            border: 1px solid #292932;

            background: #111117;

            color: #777783;

            font-size: 12px;

            cursor: pointer;

            transition: 0.2s;
        }

        .example:hover {
            color: #ffffff;

            border-color: #444450;
        }


        /* ==============================
           LOADING
        ============================== */

        .loading {
            display: none;

            text-align: center;

            color: #888894;

            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 28px;
            height: 28px;

            border: 3px solid #292932;

            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* ==============================
           RESULT
        ============================== */

        .result-section {
            max-width: 950px;

            margin: 0 auto;

            padding: 0 20px 80px;

            display: none;
        }

        .result-section.active {
            display: block;
        }

        .section-title {
            color: #777783;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 12px;
        }

        .answer-card {
            background: #111117;

            border: 1px solid #292932;

            border-radius: 16px;

            padding: 25px;

            margin-bottom: 30px;
        }

        .answer {
            color: #ddddE5;

            line-height: 1.8;

            font-size: 16px;

            white-space: pre-wrap;
        }


        /* ==============================
           SOURCES
        ============================== */

        .sources {
            display: grid;

            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );

            gap: 12px;
        }

        .source-card {
            background: #111117;

            border: 1px solid #292932;

            border-radius: 14px;

            padding: 18px;

            transition: 0.2s;
        }

        .source-card:hover {
            border-color: #40404c;

            transform: translateY(-2px);
        }

        .source-reference {
            font-size: 14px;

            font-weight: 700;

            margin-bottom: 9px;

            color: #ffffff;
        }

        .source-score {
            font-size: 11px;

            color: #686874;

            margin-bottom: 10px;
        }

        .source-text {
            font-size: 13px;

            line-height: 1.6;

            color: #888894;
        }


        /* ==============================
           FOOTER
        ============================== */

        footer {
            border-top: 1px solid #202029;

            padding: 25px;

            text-align: center;

            color: #555560;

            font-size: 12px;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            header {
                padding: 0 20px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 12px;
            }

            .hero {
                padding-top: 60px;
            }

            .hero h1 {
                font-size: 42px;
            }

            .question-footer {
                align-items: flex-end;
                gap: 15px;
            }

            .hint {
                display: none;
            }

            .ask-button {
                width: 100%;
            }

            .question-footer {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         HEADER
    ============================== -->

    <header>

        <div class="logo">

            <div class="logo-icon">
                ✝
            </div>

            <span>ScriptureLM</span>

        </div>

        <nav>
            <a href="#">About</a>
            <a href="#">GitHub</a>
        </nav>

    </header>


    <!-- ==============================
         HERO
    ============================== -->

    <section class="hero">

        <div class="hero-badge">
            Custom Transformer · RAG
        </div>

        <h1>
            Scripture<span>LM</span>
        </h1>

        <p>
            Explore the Bible with a custom language model
            and retrieval-augmented generation.
        </p>

    </section>


    <!-- ==============================
         QUESTION
    ============================== -->

    <section class="question-section">

        <div class="question-box">

            <textarea
                id="question"
                placeholder="Ask something about the Bible..."
            ></textarea>

            <div class="question-footer">

                <div class="hint">
                    Ask a question about Scripture
                </div>

                <button
                    class="ask-button"
                    id="askButton"
                    onclick="askQuestion()"
                >
                    Ask ScriptureLM
                </button>

            </div>

        </div>


        <!-- EXAMPLE QUESTIONS -->

        <div class="examples">

            <button
                class="example"
                onclick="setQuestion('Who was Moses?')"
            >
                Who was Moses?
            </button>

            <button
                class="example"
                onclick="setQuestion('What does the Bible say about love?')"
            >
                What does the Bible say about love?
            </button>

            <button
                class="example"
                onclick="setQuestion('Who was David?')"
            >
                Who was David?
            </button>

            <button
                class="example"
                onclick="setQuestion('What did God create?')"
            >
                What did God create?
            </button>

        </div>

    </section>


    <!-- ==============================
         LOADING
    ============================== -->

    <div
        class="loading"
        id="loading"
    >

        <div class="spinner"></div>

        <div>
            ScriptureLM is thinking...
        </div>

    </div>


    <!-- ==============================
         RESULTS
    ============================== -->

    <section
        class="result-section"
        id="results"
    >

        <div class="section-title">
            Answer
        </div>

        <div class="answer-card">

            <div
                class="answer"
                id="answer"
            ></div>

        </div>


        <div class="section-title">
            Sources
        </div>

        <div
            class="sources"
            id="sources"
        ></div>

    </section>


    <!-- ==============================
         FOOTER
    ============================== -->

    <footer>

        ScriptureLM · Custom Transformer + RAG

    </footer>


    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>

        function setQuestion(question) {

            document.getElementById(
                "question"
            ).value = question;

            document.getElementById(
                "question"
            ).focus();
        }


        async function askQuestion() {

            const questionInput =
                document.getElementById(
                    "question"
                );

            const question =
                questionInput.value.trim();

            if (!question) {

                alert(
                    "Please enter a question."
                );

                return;
            }


            const button =
                document.getElementById(
                    "askButton"
                );

            const loading =
                document.getElementById(
                    "loading"
                );

            const results =
                document.getElementById(
                    "results"
                );


            button.disabled = true;

            loading.classList.add(
                "active"
            );

            results.classList.remove(
                "active"
            );


            try {

                /*
                 * The Flask API endpoint will be
                 * connected here later.
                 */

                const response =
                    await fetch(
                        "/api/ask",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                question: question
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server error: "
                        + response.status
                    );
                }


                const data =
                    await response.json();


                // Display answer

                document.getElementById(
                    "answer"
                ).textContent =
                    data.answer || "";


                // Display sources

                const sources =
                    document.getElementById(
                        "sources"
                    );

                sources.innerHTML = "";


                if (
                    data.sources &&
                    data.sources.length
                ) {

                    data.sources.forEach(
                        source => {

                            const card =
                                document.createElement(
                                    "div"
                                );

                            card.className =
                                "source-card";


                            card.innerHTML = `

                                <div class="source-reference">
                                    ${escapeHtml(
                                        source.reference
                                    )}
                                </div>

                                <div class="source-score">
                                    Similarity:
                                    ${Number(
                                        source.score
                                    ).toFixed(4)}
                                </div>

                                <div class="source-text">
                                    ${escapeHtml(
                                        source.text
                                    )}
                                </div>

                            `;


                            sources.appendChild(
                                card
                            );

                        }
                    );

                }


                results.classList.add(
                    "active"
                );


                results.scrollIntoView({
                    behavior: "smooth"
                });


            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Unable to connect to ScriptureLM."
                );

            } finally {

                button.disabled = false;

                loading.classList.remove(
                    "active"
                );

            }

        }


        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text;

            return div.innerHTML;
        }


        // Allow Ctrl + Enter

        document
            .getElementById("question")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.ctrlKey &&
                        event.key === "Enter"
                    ) {

                        askQuestion();

                    }

                }
            );

    </script>

</body>
</html>
